<!DOCTYPE html>
<html>
<head>
    <title>Kumarites - Categories</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: white;
            color: #222;
        }

        img {
            display: block;
        }

        h1 {
            background-color: #0066cc;
            color: white;
            padding: 20px;
            margin: 0;
        }

        p, h2, ul {
            margin-left: 30px;
        }

        ul {
            list-style: none;
            padding: 0;
            width: 300px;
        }

        li {
            border: 1px solid #0066cc;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        footer {
            background-color: #0066cc;
            color: white;
            padding: 10px;
            margin-top: 30px;
        }

        footer p {
            margin-left: 0;
        }
    </style>
</head>

<body>

    <img src="resources/Kumarites Banner.png" alt="Kumarites Banner" width="100%">

    <h1>Categories</h1>

    <p>Browse different categories and find posts that interest you.</p>

    <h2>Choose a Category</h2>

    <ul>
        <li>Grocery</li>
        <li>Food</li>
        <li>Clothing</li>
        <li>Electronics</li>
    </ul>

    <footer>
        <p>Kumarites 2026</p>
    </footer>

</body>
</html>
